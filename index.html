<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Job Digest</title>
<meta name="description" content="Job Digest is a personal tool that sends its owner one email a day.">
<style>
  :root { color-scheme: light dark; --fg: #1f2328; --muted: #59636e; --bg: #ffffff; --link: #0969da; }
  @media (prefers-color-scheme: dark) {
    :root { --fg: #e6edf3; --muted: #9198a1; --bg: #0d1117; --link: #4493f8; }
  }
  body { margin: 0; background: var(--bg); color: var(--fg);
         font: 16px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 40rem; margin: 0 auto; padding: 3rem 1rem; }
  h1 { font-size: 1.75rem; line-height: 1.2; margin: 0 0 1rem; }
  p { margin: 0 0 1rem; }
  a { color: var(--link); }
</style>
</head>
<body>
<main>
  <h1>Job Digest</h1>
  <p>Job Digest is a personal tool with one user, its owner. Once a day it sends the owner an email summary that it prepares.</p>
  <p>It signs in with Google only to send that email from the owner's Gmail account to the owner. It can't read mail, and it isn't offered to anyone else.</p>
  <p><a href="privacy.html">Privacy policy</a></p>
</main>
</body>
</html>
